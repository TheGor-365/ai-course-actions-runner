name: Runner Infrastructure Self Test

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "00_contracts/PUBLIC_RUNNER_CENTER_CONTRACT_v01.md"
      - "docs/PUBLIC_RUNNER_DISPATCH_RUNBOOK_v01.md"
      - "docs/FACTORY_RUNNER_AUTOMATION_BACKLOG_v01.md"
  push:
    branches:
      - "launch/factory-5d-runner-infrastructure-day2"
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "00_contracts/PUBLIC_RUNNER_CENTER_CONTRACT_v01.md"
      - "docs/PUBLIC_RUNNER_DISPATCH_RUNBOOK_v01.md"
      - "docs/FACTORY_RUNNER_AUTOMATION_BACKLOG_v01.md"

permissions:
  contents: read

jobs:
  changed-path-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run policy and fixture tests
        run: bash scripts/run_runner_infrastructure_tests.sh
      - name: Assert public artifact policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          forbidden = "uses: " + "actions/upload-artifact"
          hits = [str(p) for p in Path(".github/workflows").glob("*.y*") if forbidden in p.read_text(encoding="utf-8")]
          if hits:
              raise SystemExit("public_artifact_upload=" + ",".join(hits))
          PY
          echo "public_artifacts_created=false"
          echo "private_content_public_exposure=false"

  exact-private-sha-content-semantics-smoke:
    if: ${{ github.event_name == 'push' }}
    needs: changed-path-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_REPO: TheGor-365/ai-course-source-library
      PRIVATE_BRANCH: launch/factory-5d-content-semantics
      PRIVATE_SHA: 4175b9ad01f0a92269600fc180fdd259e256f799
      GATE_ID: CONTENT_SEMANTICS_LAUNCH_GATE
      STATUS_CONTEXT: public-runner/launch-5d/content-semantics-day2
      REQUEST_ID: runner-infrastructure-day2-content-semantics-001
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      PUBLIC_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap policy guard
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_REPO_PAT:-}" ]] || { echo "policy_error=missing_private_repo_credential"; exit 2; }
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "policy_error=invalid_private_sha"; exit 2; }
          python3 scripts/runner_infrastructure_v1.py resolve-gate "$GATE_ID" "$PRIVATE_REPO" --field profile_id >/dev/null
          echo "policy_guard=pass"
          echo "request_id=$REQUEST_ID"
          echo "private_content_public_exposure=false"
          echo "artifacts_created=false"
      - name: Write pending private status
        run: bash scripts/write_private_commit_status.sh "$PRIVATE_REPO" "$PRIVATE_SHA" "$STATUS_CONTEXT" pending "Content semantics exact-SHA gate started" "$PUBLIC_RUN_URL"
      - name: Checkout exact private SHA
        id: private_checkout
        run: |
          set -euo pipefail
          PRIVATE_CHECKOUT_DIR="$RUNNER_TEMP/private_repo"
          git clone --filter=blob:none --no-checkout "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${PRIVATE_REPO}.git" "$PRIVATE_CHECKOUT_DIR" >/dev/null 2>&1
          cd "$PRIVATE_CHECKOUT_DIR"
          git fetch --depth=1 origin "refs/heads/${PRIVATE_BRANCH}:refs/remotes/origin/${PRIVATE_BRANCH}" >/dev/null 2>&1
          OBSERVED_SHA="$(git rev-parse "refs/remotes/origin/${PRIVATE_BRANCH}")"
          [[ "$OBSERVED_SHA" == "$PRIVATE_SHA" ]] || { echo "checkout_error=branch_head_sha_mismatch"; exit 2; }
          git checkout --detach "$PRIVATE_SHA" >/dev/null 2>&1
          echo "private_checkout_dir=$PRIVATE_CHECKOUT_DIR" >> "$GITHUB_OUTPUT"
          echo "private_branch_head_verified=true"
          echo "private_sha=$PRIVATE_SHA"
          echo "private_content_public_exposure=false"
      - name: Run exact-SHA content semantics gate
        id: gate
        continue-on-error: true
        run: |
          set +e
          SUMMARY_FILE="$RUNNER_TEMP/gate_summary.txt"
          bash scripts/run_manifest_gate.sh "$GATE_ID" "${{ steps.private_checkout.outputs.private_checkout_dir }}" "$PRIVATE_REPO" > "$SUMMARY_FILE" 2>&1
          RC=$?
          cat "$SUMMARY_FILE"
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -eq 0 ]]; then echo "result=PASS" >> "$GITHUB_OUTPUT"; else echo "result=FAIL" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Write final private status
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.gate.outputs.result }}" == PASS && "${{ steps.gate.outputs.exit_code }}" == 0 ]]; then STATE=success; DESCRIPTION="Content semantics exact-SHA gate passed"
          else STATE=failure; DESCRIPTION="Content semantics exact-SHA gate failed"; fi
          bash scripts/write_private_commit_status.sh "$PRIVATE_REPO" "$PRIVATE_SHA" "$STATUS_CONTEXT" "$STATE" "$DESCRIPTION" "$PUBLIC_RUN_URL"
      - name: Final exact-SHA assertion
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [[ "${{ steps.gate.outputs.result }}" == PASS ]]
          [[ "${{ steps.gate.outputs.exit_code }}" == 0 ]]
          echo "exact_private_sha_binding=PASS"
          echo "content_semantics_gate=PASS"
          echo "private_commit_status_writeback=PASS"
          echo "public_media_artifacts_created=false"
          echo "private_content_public_exposure=false"
