name: Gold PSU Source Exact Gate v1

on:
  push:
    branches:
      - worker/m1-l01-s01-runner-pre-render-finalization-v1
    paths:
      - '.github/workflows/gold-psu-source-exact-gate-v1.yml'
      - 'docs/README_FACTORY_OPERATING_CENTER_ENTRYPOINT.md'
  pull_request:
    paths:
      - '.github/workflows/gold-psu-source-exact-gate-v1.yml'
      - 'docs/README_FACTORY_OPERATING_CENTER_ENTRYPOINT.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: TheGor-365/ai-course-source-library
  SOURCE_BRANCH: worker/m1-l01-s01-gold-psu-source-final-exact-repair-v1
  SOURCE_HEAD: 4cfc9acd1509408f86c8b3a788779173395bbb2f
  PRODUCTION_REPO: TheGor-365/ai-course-production-system
  PRODUCTION_BRANCH: coord/gold-psu-finalization-v36-v1
  PRODUCTION_HEAD: 3fcb7bc68d397da2004ade7251aa5cba791f156f
  OC_BLOB_SHA: f41935cd1163a6aadc1aac89d6c59e2057402c5e
  FINALIZATION_PROGRAM_BLOB_SHA: 0ef5559c42c363e90c7566f69e7ab9bb2ae69b4d
  PSU_ROOT: Module 1/Lesson 1/1/M1-L01-S01_0000-1500_PRODUCTION_READY
  EXPECTED_CLOSURE_SHA256: b5bfbd7722cc47041689266d4f5cb9a87f15f7ad1b4da3f837a364c3052b2990
  EXPECTED_SHARED_ID_REGISTRY_SHA256: bde71f0efbc9f1bd4084d6e0afd3d0535ad012e9f66e2ce4fb0a76e6cb11faa8
  EXPECTED_PREMIUM_SHOT_SPECS_SHA256: 3232315e903a4a3a9a615eb152aff46fbbb18ad0088f34be7ddc8ab20bf6682c

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 01_checkout_exact_runner_head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 02_clone_exact_private_heads
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_PAT"
          clone_exact() {
            repo="$1" branch="$2" expected="$3" directory="$4"
            git init -q "$directory"
            git -C "$directory" remote add origin "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${repo}.git"
            remote_head=$(git -C "$directory" ls-remote origin "refs/heads/${branch}" | awk '{print $1}')
            test "$remote_head" = "$expected"
            git -C "$directory" fetch -q --depth=1 origin "$expected"
            git -C "$directory" checkout -q --detach "$expected"
            git -C "$directory" remote set-url origin "https://github.com/${repo}.git"
            test "$(git -C "$directory" rev-parse HEAD)" = "$expected"
            test -z "$(git -C "$directory" status --porcelain)"
          }
          clone_exact "$SOURCE_REPO" "$SOURCE_BRANCH" "$SOURCE_HEAD" source
          clone_exact "$PRODUCTION_REPO" "$PRODUCTION_BRANCH" "$PRODUCTION_HEAD" production
          test "$(git -C production rev-parse HEAD:00_control/FACTORY_OPERATION_CENTER.md)" = "$OC_BLOB_SHA"
          test "$(git -C production rev-parse HEAD:00_control/GOLD_PSU_FINALIZATION_PROGRAM_v01.md)" = "$FINALIZATION_PROGRAM_BLOB_SHA"

      - name: 03_verify_OC_v36_entrypoints
        run: |
          set -euo pipefail
          grep -F "CURRENT_OC_DOCUMENT_ID=FACTORY_OPERATION_CENTER_v36" source/00_factory/README_FACTORY_OPERATING_CENTER_ENTRYPOINT.md
          grep -F "CURRENT_OC_HEAD=${PRODUCTION_HEAD}" source/00_factory/README_FACTORY_OPERATING_CENTER_ENTRYPOINT.md
          grep -F "CURRENT_OC_BLOB_SHA=${OC_BLOB_SHA}" source/00_factory/README_FACTORY_OPERATING_CENTER_ENTRYPOINT.md
          grep -F "CURRENT_OC_DOCUMENT_ID=FACTORY_OPERATION_CENTER_v36" production/05_orchestration/README_FACTORY_OPERATING_CENTER_ENTRYPOINT.md
          grep -F "TWO_MINUTE_RENDER_AUTHORIZED=false" production/05_orchestration/README_FACTORY_OPERATING_CENTER_ENTRYPOINT.md
          grep -F "FULL_15_MINUTE_RENDER_AUTHORIZED=false" production/05_orchestration/README_FACTORY_OPERATING_CENTER_ENTRYPOINT.md

      - name: 04_run_source_finalization_and_OC_lineage_validators
        run: |
          set -euo pipefail
          mkdir -p receipts/reference-compiler
          python3 -m py_compile "source/${PSU_ROOT}/10_pipeline/validate_gold_psu_source_finalization_v1.py"
          python3 -m py_compile "source/${PSU_ROOT}/10_pipeline/validate_gold_psu_final_exact_oc_lineage_v1.py"
          python3 -m py_compile "source/${PSU_ROOT}/10_pipeline/compile_gold_psu_reference_v1.py"
          python3 "source/${PSU_ROOT}/10_pipeline/validate_gold_psu_source_finalization_v1.py" \
            --root source --negative-fixtures --receipt receipts/source-finalization-receipt.json
          python3 "source/${PSU_ROOT}/10_pipeline/validate_gold_psu_final_exact_oc_lineage_v1.py" \
            --root source --receipt receipts/source-oc-lineage-receipt.json
          python3 - <<'PY'
          import json
          finalization = json.load(open('receipts/source-finalization-receipt.json', encoding='utf-8'))
          lineage = json.load(open('receipts/source-oc-lineage-receipt.json', encoding='utf-8'))
          assert finalization['result'] == 'PASS'
          assert finalization['scene_count'] == 26
          assert finalization['active_shared_id_count'] >= 72
          assert finalization['unknown_shared_id_count'] == 0
          assert finalization['rejected'] == 16
          assert lineage['result'] == 'PASS_GOLD_PSU_FINAL_EXACT_OC_LINEAGE'
          assert lineage['active_current_oc_head_count'] == 1
          assert lineage['active_old_oc_head_reference_count'] == 0
          print('SOURCE_FINALIZATION_AND_OC_LINEAGE=PASS')
          PY

      - name: 05_run_canonical_reference_compiler
        run: |
          set -euo pipefail
          python3 "source/${PSU_ROOT}/10_pipeline/compile_gold_psu_reference_v1.py" \
            --repo source \
            --source-repo "$SOURCE_REPO" \
            --source-branch "$SOURCE_BRANCH" \
            --source-sha "$SOURCE_HEAD" \
            --package-root "$PSU_ROOT" \
            --output-dir receipts/reference-compiler \
            | tee receipts/reference-compiler/stdout.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('receipts/reference-compiler')
          closure = json.loads((root / 'psu_closure_receipt.json').read_text(encoding='utf-8'))
          events = json.loads((root / 'executable_event_graph.json').read_text(encoding='utf-8'))
          shots = json.loads((root / 'resolved_shot_ir.json').read_text(encoding='utf-8'))
          scenes = json.loads((root / 'resolved_scene_ir.json').read_text(encoding='utf-8'))
          assert closure['record_count'] == 105
          assert closure['unclassified_file_count'] == 0
          assert closure['missing_required_file_count'] == 0
          assert events['source_visual_event_count'] == 24
          assert events['unmapped_visual_event_count'] == 0
          assert shots['record_count'] == 26
          assert scenes['record_count'] == 26
          assert scenes['handwritten_unbound_sceneir_count'] == 0
          print('CANONICAL_REFERENCE_COMPILE=PASS')
          PY

      - name: 06_verify_content_addressed_closure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('source')
          psu = root / Path('Module 1/Lesson 1/1/M1-L01-S01_0000-1500_PRODUCTION_READY/00_gold_psu_v2')
          library = root / Path('План завода/OPERATING_CENTER/STANDARDS_VNEXT/COURSE_VISUAL_AUDIO_LIBRARY')
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = json.loads((psu / 'GOLD_PSU_MANIFEST_v2.json').read_text(encoding='utf-8'))
          closure = psu / 'GOLD_PSU_CLOSURE_SHA256SUMS.txt'
          assert sha(closure) == '${{ env.EXPECTED_CLOSURE_SHA256 }}'
          assert manifest['closure']['psu_closure_sha256'] == sha(closure)
          assert sha(library / 'course_visual_audio_id_registry_v1.json') == '${{ env.EXPECTED_SHARED_ID_REGISTRY_SHA256 }}'
          assert sha(psu / 'GOLD_PSU_S01_PREMIUM_SHOT_SPECS_v2.json') == '${{ env.EXPECTED_PREMIUM_SHOT_SPECS_SHA256 }}'
          for line in closure.read_text(encoding='utf-8').splitlines():
              if not line or line.startswith('#'):
                  continue
              expected, relative = line.split('  ', 1)
              path = root / relative
              assert path.is_file(), relative
              assert sha(path) == expected, relative
          print('CONTENT_ADDRESSED_CLOSURE=PASS')
          PY

      - name: 07_binary_and_media_leakage_gate
        run: |
          set -euo pipefail
          forbidden=$(find "source/${PSU_ROOT}" "source/План завода/OPERATING_CENTER/STANDARDS_VNEXT/COURSE_VISUAL_AUDIO_LIBRARY" -type f \
            \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.webm' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.flac' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.zip' \) -print)
          test -z "$forbidden"
          echo 'BINARY_MEDIA_LEAKAGE=0'

      - name: 08_materialize_sanitized_exact_source_receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          source = Path('source')
          psu = source / Path('Module 1/Lesson 1/1/M1-L01-S01_0000-1500_PRODUCTION_READY/00_gold_psu_v2')
          library = source / Path('План завода/OPERATING_CENTER/STANDARDS_VNEXT/COURSE_VISUAL_AUDIO_LIBRARY')
          reference = Path('receipts/reference-compiler')
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          blob = lambda rel: subprocess.check_output(['git','-C','source','rev-parse',f'HEAD:{rel.as_posix()}'], text=True).strip()
          closure = psu / 'GOLD_PSU_CLOSURE_SHA256SUMS.txt'
          manifest_rel = Path('Module 1/Lesson 1/1/M1-L01-S01_0000-1500_PRODUCTION_READY/00_gold_psu_v2/GOLD_PSU_MANIFEST_v2.json')
          registry_rel = Path('План завода/OPERATING_CENTER/STANDARDS_VNEXT/COURSE_VISUAL_AUDIO_LIBRARY/course_visual_audio_id_registry_v1.json')
          specs_rel = Path('Module 1/Lesson 1/1/M1-L01-S01_0000-1500_PRODUCTION_READY/00_gold_psu_v2/GOLD_PSU_S01_PREMIUM_SHOT_SPECS_v2.json')
          finalization = json.load(open('receipts/source-finalization-receipt.json', encoding='utf-8'))
          lineage = json.load(open('receipts/source-oc-lineage-receipt.json', encoding='utf-8'))
          reference_closure = json.load(open(reference / 'psu_closure_receipt.json', encoding='utf-8'))
          receipt = {
            'schema_version':'gold_psu_source_exact_gate_receipt.v4',
            'result':'PASS',
            'source_repository':os.environ['SOURCE_REPO'],
            'source_branch':os.environ['SOURCE_BRANCH'],
            'source_head':os.environ['SOURCE_HEAD'],
            'production_repository':os.environ['PRODUCTION_REPO'],
            'production_head':os.environ['PRODUCTION_HEAD'],
            'runner_head':subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'oc_document_id':'FACTORY_OPERATION_CENTER_v36',
            'oc_blob_sha':os.environ['OC_BLOB_SHA'],
            'psu_closure_sha256':sha(closure),
            'reference_compiler_closure_sha256':reference_closure['psu_closure_sha256'],
            'reference_compiler_record_count':reference_closure['record_count'],
            'reference_compiler_result':'PASS',
            'canonical_manifest_blob':blob(manifest_rel),
            'canonical_manifest_sha256':sha(source / manifest_rel),
            'shared_id_registry_blob':blob(registry_rel),
            'shared_id_registry_sha256':sha(source / registry_rel),
            'premium_shot_specs_blob':blob(specs_rel),
            'premium_shot_specs_sha256':sha(source / specs_rel),
            'active_current_oc_head_count':lineage['active_current_oc_head_count'],
            'active_old_oc_head_reference_count':lineage['active_old_oc_head_reference_count'],
            'scene_count':finalization['scene_count'],
            'active_shared_id_count':finalization['active_shared_id_count'],
            'unknown_shared_id_count':finalization['unknown_shared_id_count'],
            'negative_fixture_rejected_count':finalization['rejected'],
            'media_render_started':False,
            'two_minute_render_authorized':False,
            'full_15_minute_render_authorized':False,
            'no_fake_green':True,
          }
          raw = json.dumps(receipt, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n'
          Path('receipts/gold-psu-source-exact-gate-receipt-v4.json').write_text(raw, encoding='utf-8')
          Path('receipts/SHA256SUMS').write_text(f"{hashlib.sha256(raw.encode()).hexdigest()}  gold-psu-source-exact-gate-receipt-v4.json\n", encoding='utf-8')
          print(raw)
          PY

      - name: 09_upload_exact_source_receipt
        uses: actions/upload-artifact@v4
        with:
          name: gold-psu-source-exact-gate-${{ env.SOURCE_HEAD }}
          path: receipts/
          if-no-files-found: error
          retention-days: 30

      - name: 10_stop_before_media_render
        run: |
          set -euo pipefail
          echo 'SOURCE_REMOTE_EXACT_GATE_GREEN=true'
          echo 'REFERENCE_COMPILER=PASS'
          echo 'MEDIA_RENDER_STARTED=false'
          echo 'TWO_MINUTE_RENDER_AUTHORIZED=false'
          echo 'FULL_15_MINUTE_RENDER_AUTHORIZED=false'
