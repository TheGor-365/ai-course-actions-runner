name: Canonical Gold S01 Final Media Preflight v1

on:
  push:
    branches:
      - repair/m1-l01-s01-canonical-minute-runner-v1
    paths:
      - ".github/workflows/canonical-gold-s01-final-media-preflight-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  exact-media-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REPO: TheGor-365/ai-course-source-library
      SOURCE_BRANCH: worker/m1-l01-s01-canonical-executable-gold-psu-v2
      SOURCE_SHA: 28121d06b8ade42b6728a548f73b89633e1ed6d9
      PRODUCTION_REPO: TheGor-365/ai-course-production-system
      PRODUCTION_BRANCH: repair/m1-l01-s01-canonical-psu-compiler-v1
      PRODUCTION_SHA: c2dfabe87fd2807f436747d7f8ccd27f0c6e6ae1
      SOURCE_DIR: ${{ github.workspace }}/source
      PRODUCTION_DIR: ${{ github.workspace }}/production
      INPUTS_DIR: ${{ github.workspace }}/inputs
      RECEIPT_DIR: ${{ github.workspace }}/media-preflight
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      CAPTION_ARTIFACT_REPO: ${{ vars.GOLD_S01_ACCEPTED_CAPTION_ARTIFACT_REPO }}
      CAPTION_ARTIFACT_ID: ${{ vars.GOLD_S01_ACCEPTED_CAPTION_ARTIFACT_ID }}
      CAPTION_ARTIFACT_ZIP_SHA256: ${{ vars.GOLD_S01_ACCEPTED_CAPTION_ARTIFACT_ZIP_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Clone exact source and production heads
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_PAT"
          mkdir -p "$INPUTS_DIR/audio" "$INPUTS_DIR/captions" "$RECEIPT_DIR"
          for spec in \
            "$SOURCE_DIR|$SOURCE_REPO|$SOURCE_BRANCH|$SOURCE_SHA" \
            "$PRODUCTION_DIR|$PRODUCTION_REPO|$PRODUCTION_BRANCH|$PRODUCTION_SHA"; do
            IFS='|' read -r target repo branch sha <<< "$spec"
            git init -q "$target"
            git -C "$target" remote add origin "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${repo}.git"
            test "$(git -C "$target" ls-remote origin "refs/heads/${branch}" | awk '{print $1}')" = "$sha"
            git -C "$target" fetch -q --depth=1 origin "$sha"
            git -C "$target" checkout -q --detach "$sha"
            git -C "$target" remote set-url origin "https://github.com/${repo}.git"
            test "$(git -C "$target" rev-parse HEAD)" = "$sha"
            test -z "$(git -C "$target" status --porcelain)"
          done

      - name: Materialize and verify exact A3483
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download gold-s01-a3483-input-v1 \
            --repo TheGor-365/ai-course-actions-runner \
            --pattern M1_L01_S01_RU_A3483_voice_sfx_mix_v01.wav \
            --dir "$INPUTS_DIR/audio"
          audio="$INPUTS_DIR/audio/M1_L01_S01_RU_A3483_voice_sfx_mix_v01.wav"
          test "$(sha256sum "$audio" | awk '{print $1}')" = "74d9a9008b594bd8bd18f001d05542e249bd9af371c32e87181a0df42064f352"
          test "$(stat -c %s "$audio")" = "43603182"
          printf '%s  %s\n' "74d9a9008b594bd8bd18f001d05542e249bd9af371c32e87181a0df42064f352" "M1_L01_S01_RU_A3483_voice_sfx_mix_v01.wav" > "$RECEIPT_DIR/AUDIO_SHA256SUMS.txt"

      - name: Materialize exact accepted caption artifact
        id: captions
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$CAPTION_ARTIFACT_REPO"
          test -n "$CAPTION_ARTIFACT_ID"
          test -n "$CAPTION_ARTIFACT_ZIP_SHA256"
          zip="$RECEIPT_DIR/accepted-captions.zip"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${PRIVATE_REPO_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CAPTION_ARTIFACT_REPO}/actions/artifacts/${CAPTION_ARTIFACT_ID}/zip" \
            --output "$zip"
          test "$(sha256sum "$zip" | awk '{print $1}')" = "$CAPTION_ARTIFACT_ZIP_SHA256"
          mkdir -p "$RECEIPT_DIR/caption-pack"
          unzip -q "$zip" -d "$RECEIPT_DIR/caption-pack"
          mapfile -t json_files < <(find "$RECEIPT_DIR/caption-pack" -type f -name s01_ru_final_captions_v01.json)
          mapfile -t vtt_files < <(find "$RECEIPT_DIR/caption-pack" -type f -name s01_ru_final_captions_v01.vtt)
          test "${#json_files[@]}" = 1
          test "${#vtt_files[@]}" = 1
          cp "${json_files[0]}" "$INPUTS_DIR/captions/s01_ru_final_captions_v01.json"
          cp "${vtt_files[0]}" "$INPUTS_DIR/captions/s01_ru_final_captions_v01.vtt"
          test "$(sha256sum "$INPUTS_DIR/captions/s01_ru_final_captions_v01.json" | awk '{print $1}')" = "5ad105306f9e9e68c790494981692e685e4a8dcbd7d68aa60629ae495356ef18"

      - name: Run fail-closed accepted-input preflight
        id: preflight
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          python3 scripts/canonical_gold_s01_minute_runner_v1.py preflight \
            --profile config/canonical_gold_s01_minute_profile_v1.json \
            --source-dir "$SOURCE_DIR" --production-dir "$PRODUCTION_DIR" \
            --inputs-dir "$INPUTS_DIR" --output "$RECEIPT_DIR/preflight.json" 2>&1 | tee "$RECEIPT_DIR/preflight.log"
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - uses: actions/upload-artifact@v4
        if: always()
        id: upload
        with:
          name: canonical-gold-s01-final-media-preflight-${{ env.SOURCE_SHA }}-${{ env.PRODUCTION_SHA }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact media preflight receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blockers=$(python3 -c 'import json;print(",".join(json.load(open("'"$RECEIPT_DIR/preflight.json"'"))["blockers"]))' 2>/dev/null || echo PRECHECK_RECEIPT_MISSING)
          body=$(cat <<EOF
          ## Canonical Gold S01 final media preflight

          \`\`\`text
          RUN_ID=${GITHUB_RUN_ID}
          ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}
          SOURCE_SHA=${SOURCE_SHA}
          PRODUCTION_SHA=${PRODUCTION_SHA}
          AUDIO_SHA256=74d9a9008b594bd8bd18f001d05542e249bd9af371c32e87181a0df42064f352
          CAPTION_ARTIFACT_STEP=${{ steps.captions.outcome }}
          PREFLIGHT=${{ steps.preflight.outcome }}
          BLOCKERS=${blockers}
          PILOT_A_RENDERED=false
          PILOT_B_RENDERED=false
          FULL_15_MINUTE_RENDERED=false
          HUMAN_FINAL_PREVIEW_ACCEPTED=false
          NO_FAKE_GREEN=true
          \`\`\`
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/19/comments" -f body="$body" >/dev/null

      - name: Enforce accepted caption authority
        if: steps.preflight.outcome != 'success'
        run: exit 2
