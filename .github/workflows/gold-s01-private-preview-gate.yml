name: Gold S01 Private Preview Contract Gate

on:
  pull_request:
    paths:
      - ".github/workflows/gold-s01-private-preview-gate.yml"
      - "config/gold_s01_private_preview_profile_v1.json"
      - "schemas/gold_s01_private_preview_v1.schemas.json"
      - "scripts/gold_s01_private_preview/**"
      - "scripts/gold_s01_private_preview_v1.py"
      - "scripts/owner_review_gold_s01_v1.py"
      - "tests/test_gold_s01_private_preview.py"
      - "fixtures/gold_s01_private_preview/**"
      - "docs/GOLD_S01_PRIVATE_PREVIEW_RUNBOOK_v1.md"
      - "docs/gold_s01_private_preview_gap_matrix_v1.json"
  push:
    branches:
      - "repair/gold-s01-private-preview-runner-v1"
    paths:
      - ".github/workflows/gold-s01-private-preview-gate.yml"
      - "config/gold_s01_private_preview_profile_v1.json"
      - "schemas/gold_s01_private_preview_v1.schemas.json"
      - "scripts/gold_s01_private_preview/**"
      - "scripts/gold_s01_private_preview_v1.py"
      - "scripts/owner_review_gold_s01_v1.py"
      - "tests/test_gold_s01_private_preview.py"
      - "fixtures/gold_s01_private_preview/**"
      - "docs/GOLD_S01_PRIVATE_PREVIEW_RUNBOOK_v1.md"
      - "docs/gold_s01_private_preview_gap_matrix_v1.json"

permissions:
  contents: read

jobs:
  bounded-contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Compile fixed runner and owner tooling
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/gold_s01_private_preview/*.py \
            scripts/gold_s01_private_preview_v1.py \
            scripts/owner_review_gold_s01_v1.py \
            tests/test_gold_s01_private_preview.py
      - name: Validate profile and provisional fail-closed request
        run: |
          set -euo pipefail
          python3 scripts/gold_s01_private_preview_v1.py validate-profile \
            --profile config/gold_s01_private_preview_profile_v1.json
          python3 scripts/gold_s01_private_preview_v1.py validate-request \
            --profile config/gold_s01_private_preview_profile_v1.json \
            --request fixtures/gold_s01_private_preview/provisional_request.json \
            --allow-provisional
      - name: Test request contracts and mutation gates
        run: python3 tests/test_gold_s01_private_preview.py T.test_contracts_and_mutations -v
      - name: Test public refusal and exact heads
        run: python3 tests/test_gold_s01_private_preview.py T.test_public_execution_and_exact_head -v
      - name: Test exact materialization hashes
        run: python3 tests/test_gold_s01_private_preview.py T.test_materialization_exact_hashes -v
      - name: Test primary replica restore and codec
        run: python3 tests/test_gold_s01_private_preview.py T.test_store_replica_restore_overwrite_and_codec -v
      - name: Test corrupted copy rejection
        run: python3 tests/test_gold_s01_private_preview.py T.test_corrupted_copy -v
      - name: Test station failure resume idempotency
        run: python3 tests/test_gold_s01_private_preview.py T.test_idempotent_failure_resume -v
      - name: Test host probe and owner decisions
        run: python3 tests/test_gold_s01_private_preview.py T.test_host_probe_owner_and_public_diagnostic -v
      - name: Public runner diagnostic only
        run: |
          set -euo pipefail
          python3 scripts/gold_s01_private_preview_v1.py public-diagnostic \
            --profile config/gold_s01_private_preview_profile_v1.json
          echo "PRIVATE_MEDIA_EXECUTED=false"
          echo "ACTIONS_STEPS_NONE_CLASSIFICATION=PRE_STEP_INFRASTRUCTURE_FAILURE"
      - name: Assert no media binaries in Git
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          media = {'.wav', '.mp3', '.flac', '.mp4', '.mov', '.webm', '.mkv', '.png', '.jpg', '.jpeg'}
          hits = [str(path) for path in Path('.').rglob('*') if path.is_file() and path.suffix.lower() in media and '.git' not in path.parts]
          if hits:
              raise SystemExit('MEDIA_BINARY_IN_GIT=' + ','.join(hits))
          PY
      - name: Assert no secrets or raw private paths in Gold S01 scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          leak = re.compile(r'(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|/home/[A-Za-z0-9._-]+/)')
          paths = [
              Path('config/gold_s01_private_preview_profile_v1.json'),
              Path('schemas/gold_s01_private_preview_v1.schemas.json'),
              Path('scripts/gold_s01_private_preview_v1.py'),
              Path('scripts/owner_review_gold_s01_v1.py'),
              Path('tests/test_gold_s01_private_preview.py'),
              Path('docs/GOLD_S01_PRIVATE_PREVIEW_RUNBOOK_v1.md'),
              Path('docs/gold_s01_private_preview_gap_matrix_v1.json'),
              Path('.github/workflows/gold-s01-private-preview-gate.yml'),
          ]
          paths.extend(Path('scripts/gold_s01_private_preview').glob('*.py'))
          paths.extend(Path('fixtures/gold_s01_private_preview').glob('*.json'))
          hits = [str(path) for path in paths if leak.search(path.read_text(encoding='utf-8', errors='ignore'))]
          if hits:
              raise SystemExit('SECRET_OR_RAW_PATH_LEAK=' + ','.join(hits))
          PY
      - name: Assert no public artifact upload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          forbidden = 'actions/' + 'upload-artifact'
          hits = [str(path) for path in Path('.github/workflows').glob('*.y*') if forbidden in path.read_text(encoding='utf-8')]
          if hits:
              raise SystemExit('PUBLIC_ARTIFACT_UPLOAD_PRESENT=' + ','.join(hits))
          PY
          echo "PUBLIC_MEDIA_ARTIFACTS_CREATED=false"
          echo "PRIVATE_CONTENT_PUBLIC_EXPOSURE=false"
          echo "NO_FAKE_GREEN=true"
