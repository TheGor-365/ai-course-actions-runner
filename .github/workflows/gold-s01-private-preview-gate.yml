name: Gold S01 Private Preview Contract Gate

on:
  pull_request:
    paths:
      - ".github/workflows/gold-s01-private-preview-gate.yml"
      - "config/gold_s01_private_preview_profile_v1.json"
      - "schemas/gold_s01_private_preview_v1.schemas.json"
      - "scripts/gold_s01_private_preview/**"
      - "scripts/gold_s01_private_preview_v1.py"
      - "scripts/owner_review_gold_s01_v1.py"
      - "tests/test_gold_s01_private_preview.py"
      - "fixtures/gold_s01_private_preview/**"
      - "docs/GOLD_S01_PRIVATE_PREVIEW_RUNBOOK_v1.md"
      - "docs/gold_s01_private_preview_gap_matrix_v1.json"
      - "docs/gold_s01_private_preview_live_authority_v1.json"
  push:
    branches:
      - "repair/gold-s01-private-preview-runner-v1"
    paths:
      - ".github/workflows/gold-s01-private-preview-gate.yml"
      - "config/gold_s01_private_preview_profile_v1.json"
      - "schemas/gold_s01_private_preview_v1.schemas.json"
      - "scripts/gold_s01_private_preview/**"
      - "scripts/gold_s01_private_preview_v1.py"
      - "scripts/owner_review_gold_s01_v1.py"
      - "tests/test_gold_s01_private_preview.py"
      - "fixtures/gold_s01_private_preview/**"
      - "docs/GOLD_S01_PRIVATE_PREVIEW_RUNBOOK_v1.md"
      - "docs/gold_s01_private_preview_gap_matrix_v1.json"
      - "docs/gold_s01_private_preview_live_authority_v1.json"
permissions:
  contents: read
jobs:
  bounded-contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Compile fixed runner and owner tooling
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gold_s01_private_preview/*.py scripts/gold_s01_private_preview_v1.py scripts/owner_review_gold_s01_v1.py tests/test_gold_s01_private_preview.py
      - name: Validate profile and provisional fail-closed request
        run: |
          set -euo pipefail
          python3 scripts/gold_s01_private_preview_v1.py validate-profile --profile config/gold_s01_private_preview_profile_v1.json
          python3 scripts/gold_s01_private_preview_v1.py validate-request --profile config/gold_s01_private_preview_profile_v1.json --request fixtures/gold_s01_private_preview/provisional_request.json --allow-provisional
      - name: Test request contracts and mutation gates
        run: python3 tests/test_gold_s01_private_preview.py T.test_contracts_and_mutations -v
      - name: Test public refusal and exact heads
        run: python3 tests/test_gold_s01_private_preview.py T.test_public_execution_and_exact_head -v
      - name: Test external request blob and exact materialization
        run: python3 tests/test_gold_s01_private_preview.py T.test_materialization_exact_hashes -v
      - name: Test primary replica restore and codec
        run: python3 tests/test_gold_s01_private_preview.py T.test_store_replica_restore_overwrite_and_codec -v
      - name: Test exact host and RWRD store receipts
        run: python3 tests/test_gold_s01_private_preview.py T.test_host_and_store_receipts -v
      - name: Test atomic rebind and stale gate rejection
        run: python3 tests/test_gold_s01_private_preview.py T.test_rebind_idempotent_and_stale_rejection -v
      - name: Test station failure resume idempotency
        run: python3 tests/test_gold_s01_private_preview.py T.test_idempotent_failure_resume -v
      - name: Legacy private runner diagnostic only
        run: |
          set -euo pipefail
          python3 scripts/gold_s01_private_preview_v1.py public-diagnostic --profile config/gold_s01_private_preview_profile_v1.json
          echo "LEGACY_PRIVATE_HOST_PATH=LEGACY_COMPATIBILITY_ONLY"
          echo "ACTIVE_PUBLIC_MEDIA_WORKFLOW=.github/workflows/gold-s01-public-media-render.yml"
      - name: Assert no media binaries in Git
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          media={'.wav','.mp3','.flac','.mp4','.mov','.webm','.mkv','.png','.jpg','.jpeg'}
          hits=[str(p) for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in media and '.git' not in p.parts]
          if hits: raise SystemExit('MEDIA_BINARY_IN_GIT='+','.join(hits))
          PY
      - name: Assert no secrets or raw private paths in Gold S01 scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          leak=re.compile(r'(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|/home/[A-Za-z0-9._-]+/)')
          paths=[Path('config/gold_s01_private_preview_profile_v1.json'),Path('schemas/gold_s01_private_preview_v1.schemas.json'),Path('scripts/gold_s01_private_preview_v1.py'),Path('scripts/owner_review_gold_s01_v1.py'),Path('tests/test_gold_s01_private_preview.py'),Path('docs/GOLD_S01_PRIVATE_PREVIEW_RUNBOOK_v1.md'),Path('docs/gold_s01_private_preview_gap_matrix_v1.json'),Path('docs/gold_s01_private_preview_live_authority_v1.json'),Path('.github/workflows/gold-s01-private-preview-gate.yml')]
          paths.extend(Path('scripts/gold_s01_private_preview').glob('*.py'));paths.extend(Path('fixtures/gold_s01_private_preview').glob('*.json'))
          hits=[str(p) for p in paths if leak.search(p.read_text(encoding='utf-8',errors='ignore'))]
          if hits: raise SystemExit('SECRET_OR_RAW_PATH_LEAK='+','.join(hits))
          PY
      - name: Assert legacy workflow does not upload public artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          marker='uses: '+'actions/'+'upload-artifact'
          legacy=Path('.github/workflows/gold-s01-private-preview-gate.yml')
          active=Path('.github/workflows/gold-s01-public-media-render.yml')
          if marker in legacy.read_text(encoding='utf-8'):
              raise SystemExit('LEGACY_WORKFLOW_PUBLIC_ARTIFACT_UPLOAD_PRESENT')
          if marker not in active.read_text(encoding='utf-8'):
              raise SystemExit('ACTIVE_PUBLIC_MEDIA_UPLOAD_MISSING')
          PY
          echo "LEGACY_PRIVATE_HOST_PATH=LEGACY_COMPATIBILITY_ONLY"
          echo "PRIVATE_CONTENT_PUBLIC_EXPOSURE=false"
          echo "NO_FAKE_GREEN=true"
