name: Gold S01 Premium Runtime Discovery v3

on:
  push:
    branches: [worker/m1-l01-s01-runner-pre-render-finalization-v1]
    paths:
      - '.github/workflows/gold-s01-premium-runtime-discovery-v3.yml'
  pull_request:
    paths:
      - '.github/workflows/gold-s01-premium-runtime-discovery-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PRODUCTION_REPO: TheGor-365/ai-course-production-system
  PRODUCTION_BRANCH: worker/m1-l01-s01-premium-production-finalization-v1
  COMPILER_ARTIFACT_ID: '8652825560'
  COMPILER_ARTIFACT_ARCHIVE_SHA256: ea5476005645c3dbb4cc7e73e002dc1cb2f6d7b64a546104c3b0012b0fef7785
  REMOTION_ROOT: 11_tools/render_factory/remotion
  PREMIUM_ENTRYPOINT: src/goldS01VisualV2/PremiumRootV3.tsx

jobs:
  runtime-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 01_checkout_runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 02_resolve_and_clone_production_head
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_PAT"
          git init -q production
          git -C production remote add origin "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${PRODUCTION_REPO}.git"
          resolved=$(git -C production ls-remote origin "refs/heads/${PRODUCTION_BRANCH}" | awk '{print $1}')
          test "${#resolved}" = 40
          git -C production fetch -q --depth=1 origin "$resolved"
          git -C production checkout -q --detach "$resolved"
          git -C production remote set-url origin "https://github.com/${PRODUCTION_REPO}.git"
          test "$(git -C production rev-parse HEAD)" = "$resolved"
          test -z "$(git -C production status --porcelain)"
          echo "PRODUCTION_HEAD_RESOLVED=$resolved" >> "$GITHUB_ENV"
          echo "$resolved" > production-head.txt

      - name: 03_download_exact_compiler_artifact_archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${COMPILER_ARTIFACT_ID}/zip" \
            --output compiler-artifact.zip
          test "$(sha256sum compiler-artifact.zip | awk '{print $1}')" = "$COMPILER_ARTIFACT_ARCHIVE_SHA256"

      - name: 04_stage_and_verify_compiler_outputs
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 production/11_tools/render_factory/gold_s01_visual_v2/stage_premium_compiler_artifact_v3.py \
            --production-root production \
            --archive compiler-artifact.zip \
            --receipt runtime-evidence/staging-receipt.json

      - name: 05_install_and_typecheck_runtime
        working-directory: production/11_tools/render_factory/remotion
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck | tee ../../../../runtime-evidence/typecheck.log

      - name: 06_discover_exact_composition
        working-directory: production/11_tools/render_factory/remotion
        run: |
          set -euo pipefail
          npx remotion compositions "$PREMIUM_ENTRYPOINT" --log=verbose | tee ../../../../runtime-evidence/compositions.log
          grep -F 'GoldS01PremiumFirst120s' ../../../../runtime-evidence/compositions.log
          grep -E '3600|00:02:00' ../../../../runtime-evidence/compositions.log

      - name: 07_validate_active_runtime_import_graph
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('production/11_tools/render_factory/remotion/src/goldS01VisualV2')
          entry=root/'PremiumRootV3.tsx'
          seen=set(); stack=[entry]
          imports=[]
          pattern=re.compile(r"(?:from\s+|import\s*)['\"]([^'\"]+)['\"]")
          while stack:
              path=stack.pop().resolve()
              if path in seen: continue
              seen.add(path)
              text=path.read_text(encoding='utf-8')
              for spec in pattern.findall(text):
                  imports.append((path.as_posix(),spec))
                  if not spec.startswith('.'): continue
                  base=(path.parent/spec).resolve()
                  candidates=[base,base.with_suffix('.ts'),base.with_suffix('.tsx')]
                  if spec.endswith('.js'):
                      candidates += [Path(str(base)[:-3]+'.ts'),Path(str(base)[:-3]+'.tsx')]
                  target=next((x for x in candidates if x.is_file()),None)
                  if target: stack.append(target)
          joined='\n'.join(f'{a} -> {b}' for a,b in imports)
          forbidden=[
              'resolved_scene_ir_shard_01_v1.json',
              'resolved_scene_ir_shard_02_v1.json',
              'resolved_scene_ir_shard_03_v1.json',
              'resolved_scene_ir_shard_04_v1.json',
              'GoldS01HybridCompositions',
          ]
          assert not any(item in joined for item in forbidden), joined
          required=[
              'resolved_premium_scene_ir.json',
              'resolved_premium_shot_ir.json',
              'resolved_event_scene_binding.json',
              'resolved_shared_ID_binding.json',
              'resolved_asset_materialization_plan.json',
          ]
          assert all(item in joined for item in required), joined
          static=(root/'runtime/CanonicalS01CompiledEventsV2.ts').read_text(encoding='utf-8')
          assert 'VE_001' not in static
          assert 'resolved_event_scene_binding.json' in static
          registry=(root/'PremiumImplementationRegistryV3.tsx').read_text(encoding='utf-8')
          assert 'default:' not in registry
          assert 'UNKNOWN_CANONICAL_IMPLEMENTATION_EXPORT' in registry
          composition=(root/'GoldS01PremiumFirst120s.tsx').read_text(encoding='utf-8')
          assert 'GOLD_S01_PREMIUM_FIRST_120S_DURATION_IN_FRAMES = 3600' in composition
          assert 'A3483_AUDIO_REQUIRED' in composition
          assert 'ACCEPTED_CAPTION_BLOCK_COUNT_MISMATCH' in composition
          result={
              'schema_version':'premium_runtime_discovery_receipt.v3',
              'result':'PASS_DISCOVERY_NOT_FINAL_PRE_RENDER',
              'production_head':Path('production-head.txt').read_text().strip(),
              'active_module_count':len(seen),
              'old_sceneir_v1_active_import_count':0,
              'static_unresolved_compiled_event_authority_count':0,
              'hardcoded_event_id_switch_count':0,
              'hardcoded_event_parameter_count':0,
              'compiled_sceneir_runtime_consumption':True,
              'compiled_shotir_runtime_consumption':True,
              'composition_id':'GoldS01PremiumFirst120s',
              'duration_in_frames':3600,
              'media_render_started':False,
              'two_minute_render_authorized':False,
              'full_15_minute_render_authorized':False,
              'no_fake_green':True,
          }
          Path('runtime-evidence/runtime-discovery-receipt.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          Path('runtime-evidence/active-import-graph.txt').write_text(joined+'\n')
          print(json.dumps(result,sort_keys=True))
          PY

      - name: 08_upload_discovery_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-s01-premium-runtime-discovery-${{ github.sha }}
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: 09_stop_before_media_render
        run: |
          echo 'RUNTIME_DISCOVERY=PASS_DISCOVERY_NOT_FINAL_PRE_RENDER'
          echo 'MEDIA_RENDER_STARTED=false'
          echo 'TWO_MINUTE_RENDER_AUTHORIZED=false'
          echo 'FULL_15_MINUTE_RENDER_AUTHORIZED=false'
