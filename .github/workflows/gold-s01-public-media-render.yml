name: Legacy Gold S01 Public Media Render Retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject superseded execution path
        run: |
          echo "ERROR_CODE=LEGACY_WORKFLOW_SUPERSEDED"
          echo "SUCCESSOR=.github/workflows/canonical-gold-s01-minute-proofs-v1.yml"
          echo "CAPABILITY_MONTAGE_ALLOWED=false"
          echo "FULL_15_MINUTE_RENDER_AUTHORIZED=false"
          echo "FULL_15_MINUTE_RENDERED=false"
          echo "HUMAN_FINAL_PREVIEW_ACCEPTED=false"
          echo "NO_FAKE_GREEN=true"
          exit 2
