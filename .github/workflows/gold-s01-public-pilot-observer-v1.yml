name: Legacy Gold S01 Pilot Observer Retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "ERROR_CODE=LEGACY_WORKFLOW_SUPERSEDED"
          echo "OLD_TARGET_WORKFLOW=gold-s01-public-pilot-exact-v1.yml"
          echo "SUCCESSOR=.github/workflows/canonical-gold-s01-minute-proofs-v1.yml"
          echo "OBSERVER_RESTARTED_RENDER=false"
          echo "FULL_15_MINUTE_RENDER_AUTHORIZED=false"
          echo "NO_FAKE_GREEN=true"
          exit 2
