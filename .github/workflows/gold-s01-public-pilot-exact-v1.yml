name: Gold S01 Public Pilot Exact v1

on:
  push:
    branches:
      - repair/gold-s01-public-media-runner-v1
    paths:
      - ".github/workflows/gold-s01-public-pilot-exact-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: gold-s01-public-pilot-exact-v1
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PROFILE: config/gold_s01_public_media_profile_v1.json
      PRIVATE_REPO: TheGor-365/ai-course-production-system
      PRIVATE_BRANCH: repair/gold-s01-public-render-candidate-v1
      PRIVATE_SHA: 7fef4f7fe92c5adf6e494eacfce100b245cca725
      REQUEST_PATH: 05_orchestration/gold_s01_closure/runner_infrastructure/requests/M1_L01_S01_RU_GOLD_V2_PUBLIC_RENDER_v1.json
      REQUEST_BLOB: 778bd57d65823aa20dfe3cb0906e757b7ac79cd6
      REQUEST_DECLARED_SHA256: 617a24efd4e90be61fbcbec9b450307f01cf73cf17d3b49b3f29f220c2e6156e
      REQUEST_ID: M1_L01_S01_RU_GOLD_V2_PUBLIC_RENDER_V1
      PRIVATE_DIR: ${{ github.workspace }}/private-production
      OUT: ${{ github.workspace }}/pilot-output
      PREFLIGHT: ${{ github.workspace }}/pilot-preflight
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
    steps:
      - name: Checkout exact runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Validate runner profile and scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gold_s01_public_media_v1.py scripts/gold_s01_public_request_binding_v1.py
          python3 scripts/gold_s01_public_media_v1.py validate-profile --profile "$PROFILE"
          python3 tests/test_gold_s01_public_media.py -v

      - name: Install hosted media baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core fonts-liberation
          command -v node
          command -v npm
          command -v ffmpeg
          command -v ffprobe

      - name: Clone exact private render candidate
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_PAT"
          mkdir -p "$PRIVATE_DIR"
          git -C "$PRIVATE_DIR" init -q
          git -C "$PRIVATE_DIR" remote add origin "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${PRIVATE_REPO}.git"
          remote_head="$(git -C "$PRIVATE_DIR" ls-remote origin "refs/heads/${PRIVATE_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$PRIVATE_SHA"
          git -C "$PRIVATE_DIR" fetch -q --depth=20 origin "$PRIVATE_SHA"
          git -C "$PRIVATE_DIR" checkout -q --detach "$PRIVATE_SHA"
          git -C "$PRIVATE_DIR" remote set-url origin "https://github.com/${PRIVATE_REPO}.git"
          test "$(git -C "$PRIVATE_DIR" rev-parse HEAD)" = "$PRIVATE_SHA"
          git -C "$PRIVATE_DIR" cat-file -e "36fcfcc2dcb2e7251869f8be46f414a16586838a^{commit}"
          test -z "$(git -C "$PRIVATE_DIR" status --porcelain)"

      - name: Bind exact request
        id: binding
        run: |
          set -euo pipefail
          mkdir -p "$PREFLIGHT"
          python3 scripts/gold_s01_public_request_binding_v1.py validate \
            --private-dir "$PRIVATE_DIR" \
            --private-sha "$PRIVATE_SHA" \
            --request-path "$REQUEST_PATH" \
            --request-blob "$REQUEST_BLOB" \
            --request-sha256 "$REQUEST_DECLARED_SHA256" \
            --request-id "$REQUEST_ID" \
            --output "$PREFLIGHT/request-binding.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Exact composition and bridge preflight
        id: preflight
        run: |
          set -euo pipefail
          python3 scripts/gold_s01_public_media_v1.py preflight \
            --profile "$PROFILE" \
            --private-dir "$PRIVATE_DIR" \
            --private-repo "$PRIVATE_REPO" \
            --private-branch "$PRIVATE_BRANCH" \
            --private-sha "$PRIVATE_SHA" \
            --request-path "$REQUEST_PATH" \
            --request-blob "$REQUEST_BLOB" \
            --request-sha256 "${{ steps.binding.outputs.request_raw_sha256 }}" \
            --render-mode pilot_60s \
            --request-id "$REQUEST_ID" \
            --output-dir "$PREFLIGHT" \
            --github-output "$GITHUB_OUTPUT"
          test "${{ steps.preflight.outputs.preflight_status }}" = PASS

      - name: Install reproducible Remotion and Chromium
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: ${{ env.PRIVATE_DIR }}/11_tools/render_factory/remotion/package-lock.json

      - name: Materialize browser runtime
        working-directory: ${{ env.PRIVATE_DIR }}/11_tools/render_factory/remotion
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          npm ci --ignore-scripts --no-audit --no-fund
          npx remotion browser ensure

      - name: Render and machine-check exact 60-second pilot
        id: render
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 scripts/gold_s01_public_media_v1.py render \
            --profile "$PROFILE" \
            --private-dir "$PRIVATE_DIR" \
            --private-repo "$PRIVATE_REPO" \
            --private-branch "$PRIVATE_BRANCH" \
            --private-sha "$PRIVATE_SHA" \
            --request-path "$REQUEST_PATH" \
            --request-blob "$REQUEST_BLOB" \
            --request-sha256 "${{ steps.binding.outputs.request_raw_sha256 }}" \
            --render-mode pilot_60s \
            --request-id "$REQUEST_ID" \
            --output-dir "$OUT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload exact pilot artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: gold-s01-pilot-60s-${{ env.PRIVATE_SHA }}-${{ steps.render.outputs.input_fingerprint }}
          path: |
            ${{ env.OUT }}/*.mp4
            ${{ env.OUT }}/ffprobe.json
            ${{ env.OUT }}/qc.json
            ${{ env.OUT }}/SHA256SUMS.txt
            ${{ env.OUT }}/sanitized_execution_receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Download and verify pilot identity
        uses: actions/download-artifact@v4
        with:
          name: gold-s01-pilot-60s-${{ env.PRIVATE_SHA }}-${{ steps.render.outputs.input_fingerprint }}
          path: ${{ github.workspace }}/pilot-download

      - name: Verify downloaded MP4 and write back receipt
        run: |
          set -euo pipefail
          python3 scripts/gold_s01_public_media_v1.py verify-download \
            --artifact-dir "${{ github.workspace }}/pilot-download" \
            --artifact-name "gold-s01-pilot-60s-${PRIVATE_SHA}-${{ steps.render.outputs.input_fingerprint }}" \
            --expected-sha256 "${{ steps.render.outputs.mp4_sha256 }}" \
            --output "$OUT/public-artifact-download-proof.json"
          python3 scripts/gold_s01_public_media_v1.py writeback \
            --profile "$PROFILE" \
            --artifact-id "${{ steps.upload.outputs.artifact-id }}" \
            --artifact-name "gold-s01-pilot-60s-${PRIVATE_SHA}-${{ steps.render.outputs.input_fingerprint }}" \
            --private-sha "$PRIVATE_SHA" \
            --input-fingerprint "${{ steps.render.outputs.input_fingerprint }}" \
            --mp4-sha256 "${{ steps.render.outputs.mp4_sha256 }}" \
            --size-bytes "${{ steps.render.outputs.size_bytes }}" \
            --ffprobe-hash "${{ steps.render.outputs.ffprobe_hash }}" \
            --qc-hash "${{ steps.render.outputs.qc_hash }}" \
            --render-mode pilot_60s \
            --download-verified true

      - name: Final truthful status
        if: always()
        run: |
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "PRIVATE_SHA=${PRIVATE_SHA}"
          echo "PILOT_60S_RENDERED=${{ steps.render.outcome == 'success' }}"
          echo "PILOT_ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
          echo "PILOT_MACHINE_QC_GREEN=${{ steps.render.outcome == 'success' }}"
          echo "HUMAN_FINAL_PREVIEW_ACCEPTED=false"
          echo "NO_FAKE_GREEN=true"
