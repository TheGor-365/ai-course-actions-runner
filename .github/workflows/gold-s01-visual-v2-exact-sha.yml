name: Gold S01 Visual v2 Exact SHA
on:
  push:
    branches:
      - "repair/gold-s01-visual-v2-gate"
    paths:
      - ".github/workflows/gold-s01-visual-v2-exact-sha.yml"
      - "scripts/gold_s01_visual_v2_gate.py"
      - "tests/test_gold_s01_visual_v2_gate.py"
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  exact-private-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: TheGor-365/ai-course-production-system
      PRIVATE_BRANCH: repair/gold-s01-visual-runtime-v2
      PRIVATE_SHA: a98322db77c48141a4de798abd15cafee3a2f807
      PRIVATE_PR: 349
      RUNNER_PR: 15
      STATUS_CONTEXT: public-runner/gold-s01/visual-v2-no-render
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate policy tests
        run: |
          python3 -m py_compile scripts/gold_s01_visual_v2_gate.py tests/test_gold_s01_visual_v2_gate.py
          python3 -m unittest tests/test_gold_s01_visual_v2_gate.py
      - name: Fixed target guard
        run: |
          test -n "${PRIVATE_REPO_PAT:-}"
          test "$PRIVATE_REPO" = "TheGor-365/ai-course-production-system"
          test "$PRIVATE_BRANCH" = "repair/gold-s01-visual-runtime-v2"
          test "$PRIVATE_SHA" = "a98322db77c48141a4de798abd15cafee3a2f807"
          test "$PRIVATE_PR" = "349"
          test "$RUNNER_PR" = "15"
      - name: Write pending private status
        run: bash scripts/write_private_commit_status.sh "$PRIVATE_REPO" "$PRIVATE_SHA" "$STATUS_CONTEXT" pending "Gold S01 accepted-timing visual gate started" "$RUN_URL"
      - name: Checkout exact private package head
        id: checkout
        run: |
          TARGET="$RUNNER_TEMP/private-production"
          git clone --filter=blob:none --no-checkout "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${PRIVATE_REPO}.git" "$TARGET" >/dev/null 2>&1
          git -C "$TARGET" fetch --depth=1 origin "refs/heads/${PRIVATE_BRANCH}:refs/remotes/origin/${PRIVATE_BRANCH}" >/dev/null 2>&1
          test "$(git -C "$TARGET" rev-parse "refs/remotes/origin/${PRIVATE_BRANCH}")" = "$PRIVATE_SHA"
          git -C "$TARGET" checkout --detach "$PRIVATE_SHA" >/dev/null 2>&1
          test "$(git -C "$TARGET" rev-parse HEAD)" = "$PRIVATE_SHA"
          echo "private_dir=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Run fixed exact package gate
        id: gate
        continue-on-error: true
        run: |
          OUTPUT="$RUNNER_TEMP/gold-s01-visual-gate.txt"
          set +e
          python3 scripts/gold_s01_visual_v2_gate.py \
            --private-dir "${{ steps.checkout.outputs.private_dir }}" \
            --private-repo "$PRIVATE_REPO" \
            --private-branch "$PRIVATE_BRANCH" \
            --private-sha "$PRIVATE_SHA" > "$OUTPUT" 2>&1
          RC=$?
          set -e
          cat "$OUTPUT"
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          for key in result error_code diagnostic_hash private_sha visual_runtime_head test_count semantic_units shot_ir_count scene_ir_count assets_materialized active_document_count no_render_manifest_sha256 visual_input_fingerprint package_manifest_sha256 private_render_request_sha256 private_render_request_status typescript_typecheck committed_package clean_rebuilds_byte_identical stale_embedded_hash_rejected timing_bound caption_binding_complete final_render_authorized; do
            value="$(awk -F= -v key="$key" '$1==key{sub(/^[^=]*=/,"");print}' "$OUTPUT" | tail -n1)"
            echo "$key=${value:-unavailable}" >> "$GITHUB_OUTPUT"
          done
          exit 0
      - name: Build sanitized receipt
        if: ${{ always() }}
        run: |
          RECEIPT="$RUNNER_TEMP/receipt.md"
          {
            echo "## Gold S01 visual v2 accepted-timing exact gate"
            echo
            echo '```text'
            echo "RUNNER_SHA=${{ github.sha }}"
            echo "PUBLIC_RUN_ID=${{ github.run_id }}"
            echo "PRIVATE_SHA=$PRIVATE_SHA"
            echo "RESULT=${{ steps.gate.outputs.result }}"
            echo "EXIT_CODE=${{ steps.gate.outputs.exit_code }}"
            echo "ERROR_CODE=${{ steps.gate.outputs.error_code }}"
            echo "DIAGNOSTIC_HASH=${{ steps.gate.outputs.diagnostic_hash }}"
            echo "VISUAL_RUNTIME_HEAD=${{ steps.gate.outputs.visual_runtime_head }}"
            echo "TEST_COUNT=${{ steps.gate.outputs.test_count }}"
            echo "SEMANTIC_UNITS=${{ steps.gate.outputs.semantic_units }}"
            echo "SHOT_IR_COUNT=${{ steps.gate.outputs.shot_ir_count }}"
            echo "SCENE_IR_COUNT=${{ steps.gate.outputs.scene_ir_count }}"
            echo "ASSETS_MATERIALIZED=${{ steps.gate.outputs.assets_materialized }}"
            echo "ACTIVE_DOCUMENT_COUNT=${{ steps.gate.outputs.active_document_count }}"
            echo "NO_RENDER_MANIFEST_SHA256=${{ steps.gate.outputs.no_render_manifest_sha256 }}"
            echo "VISUAL_INPUT_FINGERPRINT=${{ steps.gate.outputs.visual_input_fingerprint }}"
            echo "PACKAGE_MANIFEST_SHA256=${{ steps.gate.outputs.package_manifest_sha256 }}"
            echo "PRIVATE_RENDER_REQUEST_SHA256=${{ steps.gate.outputs.private_render_request_sha256 }}"
            echo "PRIVATE_RENDER_REQUEST_STATUS=${{ steps.gate.outputs.private_render_request_status }}"
            echo "TYPESCRIPT_TYPECHECK=${{ steps.gate.outputs.typescript_typecheck }}"
            echo "COMMITTED_PACKAGE=${{ steps.gate.outputs.committed_package }}"
            echo "CLEAN_REBUILDS_BYTE_IDENTICAL=${{ steps.gate.outputs.clean_rebuilds_byte_identical }}"
            echo "STALE_EMBEDDED_HASH_REJECTED=${{ steps.gate.outputs.stale_embedded_hash_rejected }}"
            echo "TIMING_BOUND=${{ steps.gate.outputs.timing_bound }}"
            echo "CAPTION_BINDING_COMPLETE=${{ steps.gate.outputs.caption_binding_complete }}"
            echo "FINAL_RENDER_AUTHORIZED=${{ steps.gate.outputs.final_render_authorized }}"
            echo "MEDIA_RENDERED=false"
            echo "HUMAN_FINAL_PREVIEW_ACCEPTED=false"
            echo "PUBLIC_MEDIA_ARTIFACTS_CREATED=false"
            echo "PRIVATE_CONTENT_PUBLIC_EXPOSURE=false"
            echo "NO_FAKE_GREEN=true"
            echo '```'
          } > "$RECEIPT"
          cat "$RECEIPT"
      - name: Write receipt to production PR
        if: ${{ always() }}
        run: bash scripts/write_private_pr_comment.sh "$PRIVATE_REPO" "$PRIVATE_PR" "$RUNNER_TEMP/receipt.md"
      - name: Refresh runner PR body
        if: ${{ always() }}
        run: gh pr edit "$RUNNER_PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/receipt.md"
      - name: Write final private status
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.gate.outputs.result }}" == "PASS" && "${{ steps.gate.outputs.exit_code }}" == "0" ]]; then
            state=success
            description="Gold S01 accepted-timing visual gate passed"
          else
            state=failure
            description="Gold S01 accepted-timing visual gate failed"
          fi
          bash scripts/write_private_commit_status.sh "$PRIVATE_REPO" "$PRIVATE_SHA" "$STATUS_CONTEXT" "$state" "$description" "$RUN_URL"
      - name: Final assertion
        if: ${{ always() }}
        run: |
          test "${{ steps.gate.outputs.result }}" = "PASS"
          test "${{ steps.gate.outputs.exit_code }}" = "0"
