name: Gold V2 Diamond 15-minute runner

on:
  workflow_call:
    inputs:
      runner_head:
        description: Exact 40-character runner commit SHA containing this workflow and runner code.
        required: true
        type: string
      mode:
        description: Exact authorized mode from the live authority manifest.
        required: true
        type: string
      authorization_manifest_json:
        description: Complete machine-readable manifest; permission is revalidated against live OC bytes.
        required: true
        type: string
      single_use_ledger_path:
        description: Optional durable ledger path shared across invocations for a single-use identity.
        required: false
        default: ""
        type: string
    secrets:
      repo_read_token:
        description: Read-only cross-repository token. It provides transport access, never mode authority.
        required: true

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Reject non-exact runner identity
        shell: bash
        env:
          RUNNER_HEAD: ${{ inputs.runner_head }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "runner_head must be an exact lowercase commit SHA" >&2; exit 2; }
          [[ "$WORKFLOW_SHA" == "$RUNNER_HEAD" ]] || { echo "reusable workflow must be invoked at the same exact runner SHA" >&2; exit 2; }
          [[ "$WORKFLOW_REPOSITORY" == "TheGor-365/ai-course-actions-runner" ]] || { echo "unexpected reusable workflow repository" >&2; exit 2; }
          [[ "$WORKFLOW_FILE_PATH" == ".github/workflows/gold-v2-diamond-15min.yml" ]] || { echo "unexpected reusable workflow path" >&2; exit 2; }

      - name: Checkout exact runner head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TheGor-365/ai-course-actions-runner
          ref: ${{ inputs.runner_head }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Materialize exact authority manifest outside checkout
        shell: bash
        env:
          AUTHORIZATION_MANIFEST_JSON: ${{ inputs.authorization_manifest_json }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gold-v2-input"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          value = os.environ["AUTHORIZATION_MANIFEST_JSON"]
          (root / "gold-v2-input/authorization.json").write_text(value, encoding="utf-8")
          PY

      - name: Execute one fail-closed command
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SINGLE_USE_LEDGER_PATH: ${{ inputs.single_use_ledger_path }}
          REPO_READ_TOKEN: ${{ secrets.repo_read_token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.repo_read_token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          set -euo pipefail
          args=(
            --mode "$MODE"
            --authorization-manifest "$RUNNER_TEMP/gold-v2-input/authorization.json"
            --workspace "$RUNNER_TEMP/gold-v2-run"
          )
          if [[ -n "$SINGLE_USE_LEDGER_PATH" ]]; then
            args+=(--single-use-ledger "$SINGLE_USE_LEDGER_PATH")
          fi
          python3 scripts/gold_v2/runner.py "${args[@]}"

      - name: Upload scanned receipts and archives only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gold-v2-runner-${{ inputs.mode }}-${{ inputs.runner_head }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/gold-v2-run/release_receipt.json
            ${{ runner.temp }}/gold-v2-run/blocked_receipt.json
            ${{ runner.temp }}/gold-v2-run/artifacts/**/*.zip
