name: Run Private Validator

run-name: private-validator ${{ inputs.gate_id }} @ ${{ inputs.private_sha }}

on:
  workflow_dispatch:
    inputs:
      private_repo:
        description: Private repo to validate
        required: true
        type: choice
        options:
          - TheGor-365/ai-course-production-system
          - TheGor-365/ai-course-source-library
      private_branch:
        description: Private branch name; must resolve to private_sha
        required: true
        type: string
      private_sha:
        description: Exact private commit SHA to validate
        required: true
        type: string
      gate_id:
        description: Allowlisted gate id
        required: true
        type: choice
        options:
          - FACTORY_PUBLIC_RUNNER_SMOKE
          - A3479_CONTENT_ONLY_LOCAL_GATE
          - A3479_CI_SCOPE_GUARD_DOC_GATE
          - M1_L01_IMPORT_VALIDATORS_SAFE_SUBSET
          - A3480_SCRIPT_FIT_PACK_LOCAL_GATE
          - FACTORY_LAUNCH_CONTROL_PLANE_GATE
          - CONTENT_SEMANTICS_LAUNCH_GATE
      request_id:
        description: Stable request id
        required: true
        type: string
      status_context:
        description: Commit status context
        required: true
        type: string
        default: public-runner/factory/smoke
      write_status:
        description: Write private commit status
        required: true
        type: boolean
        default: true
      write_pr_comment:
        description: Write compact private PR comment
        required: true
        type: boolean
        default: false
      private_pr:
        description: Private PR number; blank disables comment
        required: false
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-private-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_REPO: ${{ inputs.private_repo }}
      PRIVATE_BRANCH: ${{ inputs.private_branch }}
      PRIVATE_SHA: ${{ inputs.private_sha }}
      GATE_ID: ${{ inputs.gate_id }}
      REQUEST_ID: ${{ inputs.request_id }}
      STATUS_CONTEXT: ${{ inputs.status_context }}
      WRITE_STATUS: ${{ inputs.write_status }}
      WRITE_PR_COMMENT: ${{ inputs.write_pr_comment }}
      PRIVATE_PR: ${{ inputs.private_pr }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      PUBLIC_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Policy guard
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_REPO_PAT:-}" ]] || { echo "policy_error=missing_private_repo_credential"; exit 2; }
          case "$PRIVATE_REPO" in
            TheGor-365/ai-course-production-system|TheGor-365/ai-course-source-library) ;;
            *) echo "policy_error=repo_not_allowlisted"; exit 2 ;;
          esac
          case "$GATE_ID" in
            FACTORY_PUBLIC_RUNNER_SMOKE|A3479_CONTENT_ONLY_LOCAL_GATE|A3479_CI_SCOPE_GUARD_DOC_GATE|M1_L01_IMPORT_VALIDATORS_SAFE_SUBSET|A3480_SCRIPT_FIT_PACK_LOCAL_GATE|FACTORY_LAUNCH_CONTROL_PLANE_GATE|CONTENT_SEMANTICS_LAUNCH_GATE) ;;
            *) echo "policy_error=gate_not_allowlisted"; exit 2 ;;
          esac
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "policy_error=private_sha_must_be_full_40_hex"; exit 2; }
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "policy_error=unsafe_request_id"; exit 2; }
          [[ "$PRIVATE_BRANCH" != *..* && "$PRIVATE_BRANCH" != /* && "$PRIVATE_BRANCH" != *' '* ]] || { echo "policy_error=unsafe_branch_name"; exit 2; }
          python3 scripts/runner_infrastructure_v1.py resolve-gate "$GATE_ID" "$PRIVATE_REPO" --field profile_id >/dev/null
          echo "policy_guard=pass"
          echo "private_repo=$PRIVATE_REPO"
          echo "private_branch=$PRIVATE_BRANCH"
          echo "private_sha=$PRIVATE_SHA"
          echo "gate_id=$GATE_ID"
          echo "request_id=$REQUEST_ID"
          echo "artifact_policy=none"
          echo "private_content_printed=false"
      - name: Write pending status
        if: ${{ inputs.write_status }}
        run: bash scripts/write_private_commit_status.sh "$PRIVATE_REPO" "$PRIVATE_SHA" "$STATUS_CONTEXT" pending "Public runner validation started" "$PUBLIC_RUN_URL"
      - name: Clone and checkout exact private SHA
        id: checkout_private
        run: |
          set -euo pipefail
          PRIVATE_CHECKOUT_DIR="$RUNNER_TEMP/private_repo"
          rm -rf "$PRIVATE_CHECKOUT_DIR"
          git config --global advice.detachedHead false
          git clone --filter=blob:none --no-checkout "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${PRIVATE_REPO}.git" "$PRIVATE_CHECKOUT_DIR" >/dev/null 2>&1
          cd "$PRIVATE_CHECKOUT_DIR"
          git fetch --depth=1 origin "refs/heads/${PRIVATE_BRANCH}:refs/remotes/origin/${PRIVATE_BRANCH}" >/dev/null 2>&1
          BRANCH_SHA="$(git rev-parse "refs/remotes/origin/${PRIVATE_BRANCH}")"
          [[ "$BRANCH_SHA" == "$PRIVATE_SHA" ]] || { echo "checkout_error=branch_head_sha_mismatch"; exit 2; }
          git checkout --detach "$PRIVATE_SHA" >/dev/null 2>&1
          echo "private_checkout_dir=$PRIVATE_CHECKOUT_DIR" >> "$GITHUB_OUTPUT"
          echo "private_branch_head_verified=true"
          echo "private_content_printed=false"
      - name: Run allowlisted gate
        id: gate
        continue-on-error: true
        run: |
          set +e
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SUMMARY_FILE="$RUNNER_TEMP/gate_summary.txt"
          bash scripts/run_manifest_gate.sh "$GATE_ID" "${{ steps.checkout_private.outputs.private_checkout_dir }}" "$PRIVATE_REPO" > "$SUMMARY_FILE" 2>&1
          RC=$?
          COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat "$SUMMARY_FILE"
          OUTPUT_SCHEMA_HASH="$(awk -F= '$1=="output_schema_hash"{print $2}' "$SUMMARY_FILE" | tail -n1)"
          SANITIZED_METRICS_HASH="$(sha256sum "$SUMMARY_FILE" | awk '{print $1}')"
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          echo "completed_at=$COMPLETED_AT" >> "$GITHUB_OUTPUT"
          echo "output_schema_hash=$OUTPUT_SCHEMA_HASH" >> "$GITHUB_OUTPUT"
          echo "sanitized_metrics_hash=$SANITIZED_METRICS_HASH" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -eq 0 ]]; then echo "result=PASS" >> "$GITHUB_OUTPUT"; else echo "result=FAIL" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Build compact comment
        if: ${{ always() }}
        run: |
          set -euo pipefail
          RESULT="${{ steps.gate.outputs.result }}"; EXIT_CODE="${{ steps.gate.outputs.exit_code }}"
          [[ -n "$RESULT" ]] || RESULT=ERROR
          [[ -n "$EXIT_CODE" ]] || EXIT_CODE=2
          COMMENT_FILE="$RUNNER_TEMP/public_runner_comment.md"
          {
            echo "## Public Runner Center result"; echo; echo '```text'
            echo "SCHEMA_VERSION=1.0"
            echo "PUBLIC_RUNNER_VALIDATED=$([[ "$RESULT" == "PASS" ]] && echo true || echo false)"
            echo "PUBLIC_RUNNER_REPO=${{ github.repository }}"
            echo "RUNNER_SHA=${{ github.sha }}"
            echo "PUBLIC_RUN_ID=${{ github.run_id }}"
            echo "PRIVATE_REPO=$PRIVATE_REPO"
            echo "PRIVATE_BRANCH=$PRIVATE_BRANCH"
            echo "PRIVATE_SHA=$PRIVATE_SHA"
            echo "GATE_ID=$GATE_ID"
            echo "REQUEST_ID=$REQUEST_ID"
            echo "STATUS_CONTEXT=$STATUS_CONTEXT"
            echo "RESULT=$RESULT"
            echo "EXIT_CODE=$EXIT_CODE"
            echo "SANITIZED_METRICS_HASH=${{ steps.gate.outputs.sanitized_metrics_hash }}"
            echo "OUTPUT_SCHEMA_HASH=${{ steps.gate.outputs.output_schema_hash }}"
            echo "ARTIFACTS_CREATED=false"
            echo "PRIVATE_ACTIONS_GREEN=false"
            echo "PRIVATE_CONTENT_PUBLIC_EXPOSURE=false"
            echo "NO_FAKE_GREEN=true"; echo '```'
          } > "$COMMENT_FILE"
          echo "comment_file=$COMMENT_FILE" >> "$GITHUB_ENV"
      - name: Write final status
        if: ${{ always() && inputs.write_status }}
        run: |
          set -euo pipefail
          RESULT="${{ steps.gate.outputs.result }}"; EXIT_CODE="${{ steps.gate.outputs.exit_code }}"
          if [[ "$RESULT" == PASS && "$EXIT_CODE" == 0 ]]; then STATE=success; DESCRIPTION="Allowlisted public runner gate passed"
          elif [[ -n "$EXIT_CODE" ]]; then STATE=failure; DESCRIPTION="Allowlisted public runner gate failed"
          else STATE=error; DESCRIPTION="Public runner infrastructure or policy error"; fi
          bash scripts/write_private_commit_status.sh "$PRIVATE_REPO" "$PRIVATE_SHA" "$STATUS_CONTEXT" "$STATE" "$DESCRIPTION" "$PUBLIC_RUN_URL"
      - name: Write compact PR comment
        if: ${{ always() && inputs.write_pr_comment && inputs.private_pr != '' }}
        run: bash scripts/write_private_pr_comment.sh "$PRIVATE_REPO" "$PRIVATE_PR" "$comment_file"
      - name: Final gate result
        if: ${{ always() }}
        run: |
          set -euo pipefail
          echo "public_runner_repo=${{ github.repository }}"
          echo "runner_sha=${{ github.sha }}"
          echo "public_run_id=${{ github.run_id }}"
          echo "private_sha=$PRIVATE_SHA"
          echo "gate_id=$GATE_ID"
          echo "request_id=$REQUEST_ID"
          echo "result=${{ steps.gate.outputs.result }}"
          echo "private_content_public_exposure=false"
          echo "artifacts_created=false"
          [[ "${{ steps.gate.outputs.result }}" == PASS && "${{ steps.gate.outputs.exit_code }}" == 0 ]]
