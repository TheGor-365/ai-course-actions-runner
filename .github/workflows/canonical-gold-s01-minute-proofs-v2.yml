name: Canonical Gold S01 Minute Proofs v2

on:
  pull_request:
    branches:
      - launch/factory-5d
    paths:
      - ".github/workflows/canonical-gold-s01-minute-proofs-v2.yml"
      - "config/canonical_gold_s01_minute_profile_v1.json"
      - "scripts/canonical_gold_s01_minute_runner_v1.py"
  push:
    branches:
      - repair/m1-l01-s01-canonical-minute-runner-v1
    paths:
      - ".github/workflows/canonical-gold-s01-minute-proofs-v2.yml"
      - "config/canonical_gold_s01_minute_profile_v1.json"
      - "scripts/canonical_gold_s01_minute_runner_v1.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: canonical-gold-s01-minute-proofs-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: TheGor-365/ai-course-source-library
  SOURCE_BRANCH: worker/m1-l01-s01-canonical-executable-gold-psu-v2
  SOURCE_SHA: 87ad805b6a7f2966058e716faa8c9fcc75ff16f8
  PRODUCTION_REPO: TheGor-365/ai-course-production-system
  PRODUCTION_BRANCH: repair/m1-l01-s01-canonical-psu-compiler-v1
  PRODUCTION_SHA: 93c82d6f799e88c3f03fbe414ac32deecafee420
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}

jobs:
  exact-no-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      closure_sha256: ${{ steps.gate.outputs.closure_sha256 }}
      compiler_sha256: ${{ steps.gate.outputs.compiler_sha256 }}
      event_graph_sha256: ${{ steps.gate.outputs.event_graph_sha256 }}
      minute_plan_sha256: ${{ steps.gate.outputs.minute_plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Clone exact private heads
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_PAT"
          for spec in \
            "${{ github.workspace }}/source|$SOURCE_REPO|$SOURCE_BRANCH|$SOURCE_SHA" \
            "${{ github.workspace }}/production|$PRODUCTION_REPO|$PRODUCTION_BRANCH|$PRODUCTION_SHA"; do
            IFS='|' read -r target repo branch sha <<< "$spec"
            git init -q "$target"
            git -C "$target" remote add origin "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${repo}.git"
            test "$(git -C "$target" ls-remote origin "refs/heads/${branch}" | awk '{print $1}')" = "$sha"
            git -C "$target" fetch -q --depth=1 origin "$sha"
            git -C "$target" checkout -q --detach "$sha"
            git -C "$target" remote set-url origin "https://github.com/${repo}.git"
            test "$(git -C "$target" rev-parse HEAD)" = "$sha"
            test -z "$(git -C "$target" status --porcelain)"
          done

      - name: Run fail-closed canonical compile gate
        id: gate
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          source_dir="${{ github.workspace }}/source"
          production_dir="${{ github.workspace }}/production"
          output_dir="${{ github.workspace }}/compiled"
          mkdir -p "$output_dir"
          {
            python3 "$source_dir/Module 1/Lesson 1/1/M1-L01-S01_0000-1500_PRODUCTION_READY/10_pipeline/validate_gold_psu_v2.py" \
              --repo "$source_dir" --expected-source-sha "$SOURCE_SHA"
            rc=$?; test "$rc" = 0 || exit "$rc"
            python3 "$production_dir/04_validators/render/validate_canonical_gold_psu_v1.py"
            rc=$?; test "$rc" = 0 || exit "$rc"
            python3 "$production_dir/11_tools/render_factory/gold_s01_visual_v2/canonical_psu_compiler_v1.py" \
              --source-dir "$source_dir" --source-repo "$SOURCE_REPO" \
              --source-branch "$SOURCE_BRANCH" --source-sha "$SOURCE_SHA" \
              --output-dir "$output_dir"
          } 2>&1 | tee "$output_dir/gate.log"
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          terminal_line=$(tail -n 1 "$output_dir/gate.log" | tr '\n\r' '  ' | cut -c1-500)
          echo "terminal_line=$terminal_line" >> "$GITHUB_OUTPUT"
          if [[ "$rc" = 0 ]]; then
            echo "closure_sha256=$(python3 -c 'import json;print(json.load(open("'"$output_dir/psu_closure_receipt.json"'"))["psu_closure_sha256"])')" >> "$GITHUB_OUTPUT"
            echo "compiler_sha256=$(sha256sum "$production_dir/11_tools/render_factory/gold_s01_visual_v2/canonical_psu_compiler_v1.py" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "event_graph_sha256=$(sha256sum "$output_dir/executable_event_graph.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "minute_plan_sha256=$(sha256sum "$output_dir/minute_window_index.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - uses: actions/setup-node@v4
        if: steps.gate.outcome == 'success'
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/production/11_tools/render_factory/remotion/package-lock.json

      - name: Typecheck deterministic runtime
        if: steps.gate.outcome == 'success'
        working-directory: ${{ github.workspace }}/production/11_tools/render_factory/remotion
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - uses: actions/upload-artifact@v4
        if: always()
        id: upload
        with:
          name: canonical-gold-s01-no-render-${{ env.SOURCE_SHA }}-${{ env.PRODUCTION_SHA }}
          path: ${{ github.workspace }}/compiled
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact terminal receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## Canonical Gold S01 no-render v2 terminal receipt

          \`\`\`text
          RUN_ID=${GITHUB_RUN_ID}
          ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}
          SOURCE_SHA=${SOURCE_SHA}
          PRODUCTION_SHA=${PRODUCTION_SHA}
          GATE=${{ steps.gate.outcome }}
          GATE_EXIT=${{ steps.gate.outputs.exit_code }}
          GATE_TERMINAL=${{ steps.gate.outputs.terminal_line }}
          PSU_CLOSURE_SHA256=${{ steps.gate.outputs.closure_sha256 || 'NOT_MATERIALIZED' }}
          COMPILER_SHA256=${{ steps.gate.outputs.compiler_sha256 || 'NOT_MATERIALIZED' }}
          EVENT_GRAPH_SHA256=${{ steps.gate.outputs.event_graph_sha256 || 'NOT_MATERIALIZED' }}
          MINUTE_PLAN_SHA256=${{ steps.gate.outputs.minute_plan_sha256 || 'NOT_MATERIALIZED' }}
          FULL_15_MINUTE_RENDERED=false
          HUMAN_FINAL_PREVIEW_ACCEPTED=false
          NO_FAKE_GREEN=true
          \`\`\`
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/19/comments" -f body="$body" >/dev/null

      - name: Enforce exact no-render gate
        if: steps.gate.outcome != 'success'
        run: exit 2

  contiguous-minute-proofs:
    needs: exact-no-render
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CAPTION_ARTIFACT_REPO: ${{ vars.GOLD_S01_ACCEPTED_CAPTION_ARTIFACT_REPO }}
      CAPTION_ARTIFACT_ID: ${{ vars.GOLD_S01_ACCEPTED_CAPTION_ARTIFACT_ID }}
      CAPTION_ARTIFACT_ZIP_SHA256: ${{ vars.GOLD_S01_ACCEPTED_CAPTION_ARTIFACT_ZIP_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Install hosted media dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg unzip fontconfig fonts-dejavu-core fonts-liberation

      - name: Clone exact private heads
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_PAT"
          for spec in \
            "${{ github.workspace }}/source|$SOURCE_REPO|$SOURCE_BRANCH|$SOURCE_SHA" \
            "${{ github.workspace }}/production|$PRODUCTION_REPO|$PRODUCTION_BRANCH|$PRODUCTION_SHA"; do
            IFS='|' read -r target repo branch sha <<< "$spec"
            git init -q "$target"
            git -C "$target" remote add origin "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${repo}.git"
            git -C "$target" fetch -q --depth=1 origin "$sha"
            git -C "$target" checkout -q --detach "$sha"
            git -C "$target" remote set-url origin "https://github.com/${repo}.git"
            test "$(git -C "$target" rev-parse HEAD)" = "$sha"
          done

      - uses: actions/download-artifact@v4
        with:
          name: canonical-gold-s01-no-render-${{ env.SOURCE_SHA }}-${{ env.PRODUCTION_SHA }}
          path: ${{ github.workspace }}/compiled

      - name: Materialize exact A3483
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/inputs/audio" "${{ github.workspace }}/inputs/captions" "${{ github.workspace }}/preflight" "${{ github.workspace }}/proofs"
          gh release download gold-s01-a3483-input-v1 \
            --repo TheGor-365/ai-course-actions-runner \
            --pattern M1_L01_S01_RU_A3483_voice_sfx_mix_v01.wav \
            --dir "${{ github.workspace }}/inputs/audio"
          test "$(sha256sum "${{ github.workspace }}/inputs/audio/M1_L01_S01_RU_A3483_voice_sfx_mix_v01.wav" | awk '{print $1}')" = "74d9a9008b594bd8bd18f001d05542e249bd9af371c32e87181a0df42064f352"
          test "$(stat -c %s "${{ github.workspace }}/inputs/audio/M1_L01_S01_RU_A3483_voice_sfx_mix_v01.wav")" = "43603182"

      - name: Materialize exact accepted caption artifact
        id: captions
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$CAPTION_ARTIFACT_REPO"
          test -n "$CAPTION_ARTIFACT_ID"
          test -n "$CAPTION_ARTIFACT_ZIP_SHA256"
          zip="${{ github.workspace }}/preflight/accepted-captions.zip"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${PRIVATE_REPO_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CAPTION_ARTIFACT_REPO}/actions/artifacts/${CAPTION_ARTIFACT_ID}/zip" \
            --output "$zip"
          test "$(sha256sum "$zip" | awk '{print $1}')" = "$CAPTION_ARTIFACT_ZIP_SHA256"
          mkdir -p "${{ github.workspace }}/preflight/caption-pack"
          unzip -q "$zip" -d "${{ github.workspace }}/preflight/caption-pack"
          mapfile -t json_files < <(find "${{ github.workspace }}/preflight/caption-pack" -type f -name s01_ru_final_captions_v01.json)
          mapfile -t vtt_files < <(find "${{ github.workspace }}/preflight/caption-pack" -type f -name s01_ru_final_captions_v01.vtt)
          test "${#json_files[@]}" = 1
          test "${#vtt_files[@]}" = 1
          cp "${json_files[0]}" "${{ github.workspace }}/inputs/captions/s01_ru_final_captions_v01.json"
          cp "${vtt_files[0]}" "${{ github.workspace }}/inputs/captions/s01_ru_final_captions_v01.vtt"
          test "$(sha256sum "${{ github.workspace }}/inputs/captions/s01_ru_final_captions_v01.json" | awk '{print $1}')" = "5ad105306f9e9e68c790494981692e685e4a8dcbd7d68aa60629ae495356ef18"

      - name: Run accepted-input preflight
        id: preflight
        continue-on-error: true
        run: |
          python3 scripts/canonical_gold_s01_minute_runner_v1.py preflight \
            --profile config/canonical_gold_s01_minute_profile_v1.json \
            --source-dir "${{ github.workspace }}/source" \
            --production-dir "${{ github.workspace }}/production" \
            --inputs-dir "${{ github.workspace }}/inputs" \
            --output "${{ github.workspace }}/preflight/preflight.json"

      - uses: actions/upload-artifact@v4
        if: steps.preflight.outcome != 'success'
        id: blocked
        with:
          name: canonical-gold-s01-minute-blocked-${{ env.SOURCE_SHA }}-${{ env.PRODUCTION_SHA }}
          path: ${{ github.workspace }}/preflight
          if-no-files-found: error
          retention-days: 30

      - name: Publish media blocker receipt
        if: steps.preflight.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blockers=$(python3 -c 'import json;print(",".join(json.load(open("${{ github.workspace }}/preflight/preflight.json"))["blockers"]))')
          body=$(cat <<EOF
          ## Canonical Gold S01 media v2 blocked

          \`\`\`text
          RUN_ID=${GITHUB_RUN_ID}
          ARTIFACT_ID=${{ steps.blocked.outputs.artifact-id }}
          SOURCE_SHA=${SOURCE_SHA}
          PRODUCTION_SHA=${PRODUCTION_SHA}
          BLOCKERS=${blockers}
          PILOT_A_RENDERED=false
          PILOT_B_RENDERED=false
          FULL_15_MINUTE_RENDERED=false
          HUMAN_FINAL_PREVIEW_ACCEPTED=false
          NO_FAKE_GREEN=true
          \`\`\`
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/19/comments" -f body="$body" >/dev/null

      - name: Enforce accepted caption authority
        if: steps.preflight.outcome != 'success'
        run: exit 2

      - uses: actions/setup-node@v4
        if: steps.preflight.outcome == 'success'
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/production/11_tools/render_factory/remotion/package-lock.json

      - name: Install Remotion and Chromium
        if: steps.preflight.outcome == 'success'
        working-directory: ${{ github.workspace }}/production/11_tools/render_factory/remotion
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx remotion browser ensure

      - name: Render exact contiguous pilots
        if: steps.preflight.outcome == 'success'
        run: |
          set -euo pipefail
          for selector in pilot_a pilot_b; do
            python3 "${{ github.workspace }}/production/11_tools/render_factory/gold_s01_visual_v2/canonical_minute_adapter_v1.py" render-window \
              --compiled-dir "${{ github.workspace }}/compiled" --selector "$selector" \
              --audio "${{ github.workspace }}/inputs/audio/M1_L01_S01_RU_A3483_voice_sfx_mix_v01.wav" \
              --captions-json "${{ github.workspace }}/inputs/captions/s01_ru_final_captions_v01.json" \
              --captions-vtt "${{ github.workspace }}/inputs/captions/s01_ru_final_captions_v01.vtt" \
              --output-dir "${{ github.workspace }}/proofs"
          done
          find "${{ github.workspace }}/proofs" -type f \( -name '*_visual.mp4' -o -name '*_audio.wav' \) -delete
          sha256sum "${{ github.workspace }}/proofs"/* > "${{ github.workspace }}/proofs/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: steps.preflight.outcome == 'success'
        id: media
        with:
          name: canonical-gold-s01-minute-proofs-${{ env.SOURCE_SHA }}-${{ env.PRODUCTION_SHA }}
          path: ${{ github.workspace }}/proofs
          if-no-files-found: error
          retention-days: 30

      - name: Enforce event-level machine QC
        if: steps.preflight.outcome == 'success'
        run: |
          set -euo pipefail
          for receipt in "${{ github.workspace }}/proofs"/*_receipt.json; do
            test "$(python3 -c 'import json;print(str(json.load(open("'"$receipt"'"))["machine_qc"]["machine_qc_green"]).lower())')" = true
          done
