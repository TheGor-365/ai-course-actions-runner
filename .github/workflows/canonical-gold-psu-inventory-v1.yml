name: Canonical Gold PSU Inventory v1

on:
  pull_request:
    branches:
      - launch/factory-5d
    paths:
      - ".github/workflows/canonical-gold-psu-inventory-v1.yml"
      - "scripts/canonical_gold_psu_inventory_v1.py"
  push:
    branches:
      - repair/m1-l01-s01-canonical-minute-runner-v1
    paths:
      - ".github/workflows/canonical-gold-psu-inventory-v1.yml"
      - "scripts/canonical_gold_psu_inventory_v1.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: canonical-gold-psu-inventory-v1-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  exact-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: TheGor-365/ai-course-source-library
      SOURCE_BRANCH: worker/m1-l01-s01-canonical-executable-gold-psu-v2
      SOURCE_SHA: e3a1e7dcaa8e8ef64eb0152e02e53df32e084ecf
      SOURCE_DIR: ${{ github.workspace }}/source
      OUT: ${{ github.workspace }}/inventory-output
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      RECEIPT_PR: "19"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Clone exact source authority
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_PAT"
          git init -q "$SOURCE_DIR"
          git -C "$SOURCE_DIR" remote add origin "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${SOURCE_REPO}.git"
          test "$(git -C "$SOURCE_DIR" ls-remote origin "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')" = "$SOURCE_SHA"
          git -C "$SOURCE_DIR" fetch -q --depth=1 origin "$SOURCE_SHA"
          git -C "$SOURCE_DIR" checkout -q --detach "$SOURCE_SHA"
          git -C "$SOURCE_DIR" remote set-url origin "https://github.com/${SOURCE_REPO}.git"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Validate canonical source and build sanitized inventory
        id: inventory
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 "$SOURCE_DIR/Module 1/Lesson 1/1/M1-L01-S01_0000-1500_PRODUCTION_READY/10_pipeline/validate_gold_psu_v2.py" \
            --repo "$SOURCE_DIR" --expected-source-sha "$SOURCE_SHA" | tee "$OUT/source-validator.jsonl"
          python3 scripts/canonical_gold_psu_inventory_v1.py \
            --repo "$SOURCE_DIR" \
            --source-repo "$SOURCE_REPO" \
            --source-sha "$SOURCE_SHA" \
            --output "$OUT/source_inventory.json" | tee "$OUT/inventory.log"
          sha256sum "$OUT/source_inventory.json" > "$OUT/SHA256SUMS.txt"
          echo "inventory_sha256=$(sha256sum "$OUT/source_inventory.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "package_file_count=$(python3 -c 'import json;print(json.load(open("'"$OUT/source_inventory.json"'"))["package_file_count"])')" >> "$GITHUB_OUTPUT"
          echo "external_file_count=$(python3 -c 'import json;print(json.load(open("'"$OUT/source_inventory.json"'"))["external_dependency_file_count"])')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: canonical-gold-psu-inventory-${{ env.SOURCE_SHA }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish sanitized run receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## Canonical Gold PSU inventory proof

          \`\`\`text
          RUN_ID=${GITHUB_RUN_ID}
          ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}
          SOURCE_SHA=${SOURCE_SHA}
          INVENTORY_SHA256=${{ steps.inventory.outputs.inventory_sha256 }}
          PACKAGE_FILE_COUNT=${{ steps.inventory.outputs.package_file_count }}
          EXTERNAL_DEPENDENCY_FILE_COUNT=${{ steps.inventory.outputs.external_file_count }}
          PRIVATE_CONTENT_INCLUDED=false
          FULL_15_MINUTE_RENDERED=false
          HUMAN_FINAL_PREVIEW_ACCEPTED=false
          NO_FAKE_GREEN=true
          \`\`\`
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${RECEIPT_PR}/comments" -f body="$body" >/dev/null

      - name: Emit receipt
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "INVENTORY_ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
          echo "PRIVATE_CONTENT_INCLUDED=false"
          echo "FULL_15_MINUTE_RENDERED=false"
          echo "HUMAN_FINAL_PREVIEW_ACCEPTED=false"
          echo "NO_FAKE_GREEN=true"
